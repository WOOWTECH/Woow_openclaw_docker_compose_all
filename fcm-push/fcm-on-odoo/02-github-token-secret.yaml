# github-token secret — required for cloning private WOOWTECH repos
# in the clone-fcm-plugin init container.
#
# The woow_odoo_fcm_push repo is PRIVATE on GitHub. The init container
# uses this token to authenticate the git clone.
#
# PLACEHOLDER ONLY — inject at deploy time:
#
#   # PRODUCTION: use a fine-grained PAT with Contents:read scope on
#   # WOOWTECH/woow_odoo_fcm_push only. Never use a broad-scope token.
#   kubectl -n $NAMESPACE create secret generic github-token \
#     --from-literal=token="$(cat /secure/path/to/github-read-pat)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The clone-fcm-plugin init container references this secret as optional:
# if absent, it falls back to unauthenticated clone (public repos only).
---
apiVersion: v1
kind: Secret
metadata:
  name: github-token
  namespace: $NAMESPACE
  labels:
    app.kubernetes.io/part-of: $NAMESPACE
type: Opaque
stringData:
  token: "REPLACE-AT-DEPLOY-TIME"
