# =============================================================
# Hermes Agent - Main AI Assistant Service
# Image: nousresearch/hermes-agent:latest (Docker Hub)
# Port:  8642 (gateway), 9119 (dashboard)
# Command: gateway run (headless server mode)
# Data dir: /opt/data
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes
  labels:
    app: hermes-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      containers:
        - name: hermes-agent
          image: nousresearch/hermes-agent:latest
          imagePullPolicy: Always
          args:
            - gateway
            - run
          ports:
            - containerPort: 8642
              name: gateway
            - containerPort: 9119
              name: dashboard
          env:
            # Enable dashboard
            - name: HERMES_DASHBOARD
              value: "1"
            # API server for OpenAI-compatible endpoint
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: API_SERVER_KEY
            - name: API_SERVER_CORS_ORIGINS
              value: "*"
            # Allow all users (no allowlist filtering)
            - name: GATEWAY_ALLOW_ALL_USERS
              value: "true"
            # LLM
            - name: MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: MINIMAX_API_KEY
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - "apt-get update -qq && apt-get install -y -qq chromium --no-install-recommends > /tmp/chromium-install.log 2>&1 &"
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
          readinessProbe:
            tcpSocket:
              port: 8642
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8642
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-home-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent-svc
  namespace: hermes
  labels:
    app: hermes-agent
    app.kubernetes.io/part-of: hermes
spec:
  selector:
    app: hermes-agent
  ports:
    - protocol: TCP
      port: 8642
      targetPort: 8642
      name: gateway
    - protocol: TCP
      port: 9119
      targetPort: 9119
      name: dashboard
  type: ClusterIP
