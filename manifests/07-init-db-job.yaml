apiVersion: batch/v1
kind: Job
metadata:
  name: inzense-odoo-init
  namespace: inzense
  labels:
    app.kubernetes.io/name: inzense-odoo
    app.kubernetes.io/component: init
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inzense-odoo
        app.kubernetes.io/component: init
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z inzense-postgres 5432; do
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: odoo-init
          image: odoo:18.0
          imagePullPolicy: IfNotPresent
          command:
            - odoo
            - --config=/etc/odoo/odoo.conf
            - --database=inzense
            - --init=base,contacts,project,calendar,mail,account,mrp,point_of_sale,stock,website,website_sale,loyalty,website_blog,purchase,sale_management,hr,crm
            - --load-language=zh_TW
            - --without-demo=
            - --stop-after-init
          env:
            - name: HOST
              value: inzense-postgres
            - name: PORT
              value: "5432"
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: inzense-db-secret
                  key: POSTGRES_USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inzense-db-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "3"
              memory: 4Gi
          volumeMounts:
            - name: odoo-config
              mountPath: /etc/odoo
              readOnly: true
            - name: odoo-filestore
              mountPath: /var/lib/odoo
            - name: odoo-addons
              mountPath: /mnt/extra-addons
      volumes:
        - name: odoo-config
          configMap:
            name: odoo-config
        - name: odoo-filestore
          persistentVolumeClaim:
            claimName: inzense-odoo-filestore-pvc
        - name: odoo-addons
          persistentVolumeClaim:
            claimName: inzense-odoo-addons-pvc
