# =============================================================
# Hermes Agent Stack — Podman Compose (Pod Mode)
# =============================================================
# Agent + Dashboard + WebUI 共享 localhost (Podman pod)
# PostgreSQL + Redis 同 pod
#
# 用法:
#   cp .env.example .env   # 填入 API keys
#   podman-compose up -d
#
# 端口:
#   8787 — WebUI (日常使用)
#   9119 — Dashboard (管理設定 + Terminal TUI)
#   8642 — Gateway API (OpenAI-compatible)
# =============================================================

x-podman:
  in_pod: true

services:
  # ── 1. Hermes Agent (Gateway:8642 + Dashboard:9119) ──
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_TUI=1
      - HERMES_DASHBOARD_INSECURE=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
      - API_SERVER_CORS_ORIGINS=*
      - GATEWAY_ALLOW_ALL_USERS=true
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - PATH=/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - hermes-data:/opt/data
    shm_size: "1g"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8642/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "2.0"

  # ── 2. Hermes WebUI (:8787) ──
  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    restart: unless-stopped
    depends_on:
      hermes-agent:
        condition: service_healthy
    tty: true
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_HOME=/home/hermeswebui/.hermes
      - GATEWAY_HEALTH_URL=http://localhost:8642
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - WANTED_UID=${HERMES_UID:-1000}
      - WANTED_GID=${HERMES_GID:-1000}
      - HERMES_WEBUI_PASSWORD=${WEBUI_PASSWORD:-admin}
      - PATH=/home/hermeswebui/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - hermes-data:/home/hermeswebui/.hermes
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8787/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  # ── 3. PostgreSQL 15 ──
  postgresql:
    image: postgres:15
    container_name: hermes-postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_DB=hermes
      - POSTGRES_USER=hermes
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 4. Redis 7 ──
  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  hermes-data:
  postgres-data:
  redis-data:
