# TokenReview RBAC for whitelist-service (FR-SE self-enrollment).
#
# The whitelist-service's K8sTokenReviewVerifier calls the k8s TokenReview API
# to validate the sidecar's projected SA token. This requires the built-in
# system:auth-delegator ClusterRole (which grants create on tokenreviews).
#
# ServiceAccount: whitelist-service in woow-fcm-central.
# ClusterRoleBinding: binds it to system:auth-delegator.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: whitelist-service
  namespace: woow-fcm-central
  labels:
    app.kubernetes.io/part-of: woow-fcm-central
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: woow-fcm-central-auth-delegator
  labels:
    app.kubernetes.io/part-of: woow-fcm-central
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: whitelist-service
    namespace: woow-fcm-central
