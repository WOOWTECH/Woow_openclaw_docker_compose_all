# =============================================================
# Odoo 18 - PersistentVolumeClaim: data (10Gi)
# Stores: filestore, sessions
# =============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mujimed-odoo-data
  namespace: mujimed-odoo
  labels:
    app: mujimed-odoo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# =============================================================
# Odoo 18 - PersistentVolumeClaim: addons (5Gi)
# Stores: WOOWTECH custom addons
# =============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mujimed-odoo-addons
  namespace: mujimed-odoo
  labels:
    app: mujimed-odoo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# =============================================================
# Odoo 18 - ConfigMap: odoo.conf
# =============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mujimed-odoo-config
  namespace: mujimed-odoo
  labels:
    app: mujimed-odoo
data:
  odoo.conf: |
    [options]
    addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
    data_dir = /var/lib/odoo
    db_host = mujimed-db-svc
    db_port = 5432
    db_user = mujimed
    db_password = mujimed
    db_name = mujimed
    admin_passwd = admin
    proxy_mode = True
    without_demo = all
    list_db = False
    db_maxconn = 64
    workers = 4
    max_cron_threads = 1
    limit_memory_hard = 2684354560
    limit_memory_soft = 2147483648
    limit_time_cpu = 1200
    limit_time_real = 2400
    log_level = warn
---
# =============================================================
# Odoo 18 - Deployment
#
# Image: odoo:18.0
# Runs as root, drops to odoo user via entrypoint
# First boot: downloads WOOWTECH addons, installs all modules,
#             configures Taiwan locale (zh_TW, TWD, Asia/Taipei)
# Admin: admin / admin
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mujimed-odoo
  namespace: mujimed-odoo
  labels:
    app: mujimed-odoo
    app.kubernetes.io/component: erp
    app.kubernetes.io/version: "18.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mujimed-odoo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mujimed-odoo
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - woowtech-ai-coder-asus-tuf-gaming-f15-fx507zu4-fx507zu4
                      - woowtechcluster1-aorus-15p-xd
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z mujimed-db-svc 5432; do
                echo "PostgreSQL not ready, retrying in 2s..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: odoo
          image: odoo:18.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - /bin/bash
            - -c
            - |
              ADDONS_DIR="/mnt/extra-addons"
              DATA_DIR="/var/lib/odoo"
              MARKER="$DATA_DIR/.mujimed-initialized"

              echo "[mujimed] ==========================================="
              echo "[mujimed] Odoo 18 - Mujimed SaaS Platform"
              echo "[mujimed] ==========================================="

              # ─── Download WOOWTECH addons from GitHub ───────────────
              echo "[mujimed] Checking WOOWTECH custom addons..."
              python3 << 'PYEOF'
              import urllib.request, tarfile, io, os, ssl

              github_token = os.environ.get("GITHUB_TOKEN", "")
              addons_dir = "/mnt/extra-addons"
              # (github_repo_name, local_directory_name)
              repos = [
                  ("Odoo_reservation_module", "Odoo_reservation_module"),
                  ("Woow_odoo_loyalty_card_enhance", "Woow_odoo_loyalty_card_enhance"),
                  ("Woow_odoo_portal_user_ui", "Woow_odoo_portal_user_ui"),
                  ("Woow_odoo_website_auth", "Woow_odoo_website_auth"),
              ]

              ctx = ssl.create_default_context()

              for repo, local_name in repos:
                  dest = os.path.join(addons_dir, local_name)
                  if os.path.exists(dest) and os.listdir(dest):
                      print(f"  [ok] {repo} -> {local_name} already present")
                      continue

                  downloaded = False
                  for branch in ["18.0", "main", "master"]:
                      url = f"https://github.com/WOOWTECH/{repo}/archive/refs/heads/{branch}.tar.gz"
                      try:
                          req = urllib.request.Request(url)
                          if github_token:
                              req.add_header("Authorization", f"token {github_token}")
                          response = urllib.request.urlopen(req, context=ctx, timeout=60)
                          tar_data = io.BytesIO(response.read())
                          tar = tarfile.open(fileobj=tar_data, mode="r:gz")
                          os.makedirs(dest, exist_ok=True)
                          for member in tar.getmembers():
                              parts = member.name.split("/", 1)
                              if len(parts) > 1 and parts[1]:
                                  member.name = parts[1]
                                  if hasattr(tarfile, 'data_filter'):
                                      tar.extract(member, dest, filter='data')
                                  else:
                                      tar.extract(member, dest)
                          print(f"  [ok] {repo} -> {local_name} (branch: {branch})")
                          downloaded = True
                          break
                      except Exception:
                          continue
                  if not downloaded:
                      print(f"  [WARN] {repo} could not be downloaded")
              PYEOF

              # ─── Build addons_path ───────────────────────────────────
              ADDONS_PATH="/usr/lib/python3/dist-packages/odoo/addons"
              HAS_ROOT_MODULES=false
              for dir in /mnt/extra-addons/*/; do
                  [ ! -d "$dir" ] && continue
                  if [ -f "${dir}__manifest__.py" ]; then
                      # Single-module at root level of extra-addons
                      HAS_ROOT_MODULES=true
                  else
                      # Multi-module repo: add repo dir to addons_path
                      for subdir in "$dir"*/; do
                          if [ -f "${subdir}__manifest__.py" ]; then
                              ADDONS_PATH="${dir%/},$ADDONS_PATH"
                              break
                          fi
                      done
                  fi
              done
              # Only include /mnt/extra-addons if it has direct module subdirs
              if [ "$HAS_ROOT_MODULES" = true ]; then
                  ADDONS_PATH="/mnt/extra-addons,$ADDONS_PATH"
              fi
              echo "[mujimed] addons_path: $ADDONS_PATH"

              # ─── First boot: initialize database ────────────────────
              if [ ! -f "$MARKER" ]; then
                  echo "[mujimed] ============================================"
                  echo "[mujimed] FIRST BOOT - Initializing database..."
                  echo "[mujimed] This will take 5-10 minutes."
                  echo "[mujimed] ============================================"

                  # Standard Odoo 18 modules (dependencies for custom addons)
                  MODULES="base,web,calendar,resource,mail"
                  MODULES="$MODULES,website,website_sale,portal,payment,product,sale"
                  MODULES="$MODULES,stock,membership"
                  MODULES="$MODULES,loyalty,sale_loyalty,pos_loyalty"

                  # Discover available custom modules
                  for dir in /mnt/extra-addons/*/; do
                      if [ -f "${dir}__manifest__.py" ]; then
                          modname=$(basename "$dir")
                          MODULES="$MODULES,$modname"
                          echo "  [addon] $modname"
                      fi
                      for subdir in "$dir"*/; do
                          if [ -f "${subdir}__manifest__.py" ]; then
                              modname=$(basename "$subdir")
                              MODULES="$MODULES,$modname"
                              echo "  [addon] $modname (sub)"
                          fi
                      done
                  done

                  echo "[mujimed] Installing: $MODULES"

                  if su -s /bin/bash odoo -c "odoo \
                      --addons-path=$ADDONS_PATH \
                      --data-dir=/var/lib/odoo \
                      --db_host=mujimed-db-svc \
                      --db_port=5432 \
                      --db_user=mujimed \
                      --db_password=mujimed \
                      -d mujimed \
                      -i $MODULES \
                      --load-language=zh_TW \
                      --stop-after-init \
                      --without-demo=all \
                      --no-http"; then

                      # ─── Configure Taiwan settings ──────────────────
                      echo "[mujimed] Configuring Taiwan locale..."
                      python3 << 'PYEOF2'
              import psycopg2, sys
              try:
                  conn = psycopg2.connect(host="mujimed-db-svc", port=5432,
                      dbname="mujimed", user="mujimed", password="mujimed")
                  cur = conn.cursor()
                  # Check which columns exist (base-only has fewer columns)
                  cur.execute("SELECT column_name FROM information_schema.columns WHERE table_name='res_company'")
                  company_cols = {r[0] for r in cur.fetchall()}
                  cur.execute("SELECT column_name FROM information_schema.columns WHERE table_name='res_partner'")
                  partner_cols = {r[0] for r in cur.fetchall()}
                  # Update company name
                  cur.execute("UPDATE res_company SET name='Mujimed' WHERE id=1")
                  # Set currency/country only if columns exist
                  if 'currency_id' in company_cols:
                      cur.execute("UPDATE res_currency SET active = true WHERE name = 'TWD'")
                      cur.execute("SELECT id FROM res_currency WHERE name = 'TWD'")
                      twd_id = cur.fetchone()
                      if twd_id:
                          cur.execute("UPDATE res_company SET currency_id=%s WHERE id=1", (twd_id[0],))
                  if 'country_id' in company_cols:
                      cur.execute("SELECT id FROM res_country WHERE code = 'TW'")
                      tw_id = cur.fetchone()
                      if tw_id:
                          cur.execute("UPDATE res_company SET country_id=%s WHERE id=1", (tw_id[0],))
                  # Update admin user lang/tz (check columns exist first)
                  cur.execute("SELECT column_name FROM information_schema.columns WHERE table_name='res_users'")
                  user_cols = {r[0] for r in cur.fetchall()}
                  user_updates = []
                  if 'lang' in user_cols: user_updates.append("lang='zh_TW'")
                  if 'tz' in user_cols: user_updates.append("tz='Asia/Taipei'")
                  if user_updates:
                      cur.execute(f"UPDATE res_users SET {','.join(user_updates)} WHERE id=2")
                  # Update partner records
                  partner_updates = ["name='Mujimed'"]
                  if 'lang' in partner_cols: partner_updates.append("lang='zh_TW'")
                  if 'tz' in partner_cols: partner_updates.append("tz='Asia/Taipei'")
                  cur.execute(f"UPDATE res_partner SET {','.join(partner_updates)} WHERE id=(SELECT partner_id FROM res_company WHERE id=1)")
                  if 'country_id' in partner_cols:
                      cur.execute("SELECT id FROM res_country WHERE code = 'TW'")
                      tw_id = cur.fetchone()
                      if tw_id:
                          cur.execute("UPDATE res_partner SET country_id=%s WHERE id IN (SELECT partner_id FROM res_users WHERE id=2)", (tw_id[0],))
                  cur.execute("INSERT INTO ir_config_parameter (key,value,create_uid,write_uid,create_date,write_date) VALUES ('web.default_timezone','Asia/Taipei',1,1,NOW(),NOW()) ON CONFLICT (key) DO UPDATE SET value='Asia/Taipei'")
                  conn.commit()
                  conn.close()
                  print("[mujimed] Taiwan config: name=Mujimed lang=zh_TW tz=Asia/Taipei")
              except Exception as e:
                  print(f"[mujimed] Taiwan config error: {e}", file=sys.stderr)
              PYEOF2

                      # ─── Configure Multi-Website (B2B + B2C) ──────
                      echo "[mujimed] Configuring multi-website..."
                      python3 << 'PYEOF3'
              import psycopg2, sys
              try:
                  conn = psycopg2.connect(host="mujimed-db-svc", port=5432,
                      dbname="mujimed", user="mujimed", password="mujimed")
                  cur = conn.cursor()

                  # Website 1 (default): B2C consumer site
                  cur.execute("UPDATE website SET name='Mujimed B2C', domain='https://b2cmujimed-odoo.woowtech.io' WHERE id=1")

                  # Get defaults from existing website for NOT NULL fields
                  cur.execute("SELECT user_id, default_lang_id FROM website WHERE id=1")
                  row = cur.fetchone()
                  user_id, lang_id = row[0], row[1]

                  # Website 2: B2B enterprise site (copy NOT NULL defaults from website 1)
                  cur.execute("SELECT id FROM website WHERE name='Mujimed B2B'")
                  if not cur.fetchone():
                      cur.execute("""
                          INSERT INTO website (name, domain, company_id, default_lang_id, user_id,
                              show_line_subtotals_tax_selection, shop_default_sort,
                              product_page_image_layout, product_page_image_width,
                              product_page_image_spacing, ecommerce_access,
                              create_uid, write_uid, create_date, write_date)
                          VALUES ('Mujimed B2B', 'https://b2bmujimed-odoo.woowtech.io', 1, %s, %s,
                              'tax_excluded', 'website_sequence asc',
                              'carousel', '50_pc', 'small', 'everyone',
                              1, 1, NOW(), NOW())
                      """, (lang_id, user_id))
                      print("[mujimed] Created B2B website")
                  else:
                      print("[mujimed] B2B website already exists")

                  conn.commit()
                  conn.close()
                  print("[mujimed] Multi-website: B2C=b2cmujimed-odoo.woowtech.io, B2B=b2bmujimed-odoo.woowtech.io")
              except Exception as e:
                  print(f"[mujimed] Multi-website config error: {e}", file=sys.stderr)
              PYEOF3

                      touch "$MARKER"
                      echo "[mujimed] Init complete!"
                  else
                      echo "[mujimed] WARNING: Module install had errors, will retry on next restart"
                  fi
              else
                  echo "[mujimed] Database already initialized"
              fi

              # ─── Start Odoo as odoo user ────────────────────────────
              echo "[mujimed] Starting Odoo 18 server..."
              echo "[mujimed] Using addons_path: $ADDONS_PATH"
              exec su -s /bin/bash odoo -c "odoo --config=/etc/odoo/odoo.conf --addons-path=$ADDONS_PATH"
          ports:
            - containerPort: 8069
              name: odoo-http
            - containerPort: 8072
              name: odoo-lp
          env:
            - name: HOST
              value: "mujimed-db-svc"
            - name: PORT
              value: "5432"
            - name: USER
              value: "mujimed"
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mujimed-secrets
                  key: POSTGRES_PASSWORD
            - name: PYTHONPATH
              value: "/var/lib/odoo/.local/lib/python3.12/site-packages"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mujimed-secrets
                  key: GITHUB_TOKEN
                  optional: true
          volumeMounts:
            - name: odoo-data
              mountPath: /var/lib/odoo
            - name: odoo-addons
              mountPath: /mnt/extra-addons
            - name: odoo-config
              mountPath: /etc/odoo/odoo.conf
              subPath: odoo.conf
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /web/login
              port: 8069
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /web/login
              port: 8069
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /web/login
              port: 8069
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
        # ─── Nginx sidecar: asset caching, gzip, websocket routing ───
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /tmp/nginx-cache
            - name: nginx-image-cache
              mountPath: /tmp/nginx-image-cache
      volumes:
        - name: odoo-data
          persistentVolumeClaim:
            claimName: mujimed-odoo-data
        - name: odoo-addons
          persistentVolumeClaim:
            claimName: mujimed-odoo-addons
        - name: odoo-config
          configMap:
            name: mujimed-odoo-config
        - name: nginx-config
          configMap:
            name: mujimed-nginx-config
        - name: nginx-cache
          emptyDir:
            sizeLimit: 500Mi
        - name: nginx-image-cache
          emptyDir:
            sizeLimit: 500Mi
---
# =============================================================
# Nginx - ConfigMap
# Reverse proxy: gzip, asset caching, websocket routing to 8072
# =============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mujimed-nginx-config
  namespace: mujimed-odoo
  labels:
    app: mujimed-odoo
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 2048;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        client_max_body_size 100m;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 256;
        gzip_types
            text/plain
            text/css
            text/javascript
            application/javascript
            application/json
            application/xml
            image/svg+xml
            font/woff2
            application/wasm;

        proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=odoo_assets:20m max_size=500m inactive=60d;
        proxy_cache_path /tmp/nginx-image-cache levels=1:2 keys_zone=odoo_images:20m max_size=1g inactive=7d;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        upstream odoo_backend {
            server 127.0.0.1:8069;
            keepalive 16;
        }

        upstream odoo_longpolling {
            server 127.0.0.1:8072;
        }

        server {
            listen 8080;
            server_name _;

            absolute_redirect off;
            port_in_redirect off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            add_header X-Content-Type-Options nosniff always;

            location /web/assets/ {
                proxy_pass http://odoo_backend;
                proxy_cache odoo_assets;
                proxy_cache_valid 200 60d;
                proxy_cache_use_stale error timeout updating;
                add_header X-Cache-Status $upstream_cache_status;
                expires 60d;
                access_log off;
            }

            location /web/static/ {
                proxy_pass http://odoo_backend;
                proxy_cache odoo_assets;
                proxy_cache_valid 200 30d;
                proxy_cache_use_stale error timeout updating;
                add_header X-Cache-Status $upstream_cache_status;
                expires 30d;
                access_log off;
            }

            location /web/image {
                proxy_pass http://odoo_backend;
                proxy_cache odoo_images;
                proxy_cache_valid 200 7d;
                proxy_cache_use_stale error timeout updating;
                proxy_cache_key $scheme$host$request_uri;
                add_header X-Cache-Status $upstream_cache_status;
                expires 7d;
                access_log off;
            }

            location /web/content {
                proxy_pass http://odoo_backend;
                proxy_cache odoo_images;
                proxy_cache_valid 200 7d;
                proxy_cache_use_stale error timeout updating;
                proxy_cache_key $scheme$host$request_uri;
                add_header X-Cache-Status $upstream_cache_status;
                expires 7d;
                access_log off;
            }

            location /websocket {
                proxy_pass http://odoo_longpolling;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 86400;
            }

            location / {
                proxy_pass http://odoo_backend;
                proxy_read_timeout 720s;
                proxy_connect_timeout 720s;
                proxy_send_timeout 720s;
                proxy_cookie_flags ~ secure samesite=lax;
            }
        }
    }
---
# =============================================================
# Odoo 18 - Service (routes to nginx:8080)
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: mujimed-odoo-svc
  namespace: mujimed-odoo
  labels:
    app: mujimed-odoo
spec:
  selector:
    app: mujimed-odoo
  ports:
    - protocol: TCP
      port: 8069
      targetPort: 8080
      name: http
  type: ClusterIP
