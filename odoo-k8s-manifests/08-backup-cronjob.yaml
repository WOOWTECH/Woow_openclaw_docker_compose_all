# =============================================================
# Odoo PostgreSQL Backup CronJob
# Runs pg_dump daily at 03:30 UTC (offset from OpenClaw 03:00)
# Keeps last 7 backups on the filestore PVC
# =============================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: odoo-postgres-backup
  namespace: markstudio-odoo
  labels:
    app: odoo-db
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: markstudio-odoo
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: odoo-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16
              securityContext:
                allowPrivilegeEscalation: false
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: odoo-secrets
                      key: POSTGRES_PASSWORD
              command:
                - sh
                - -c
                - |
                  BACKUP_DIR="/backups"
                  mkdir -p "$BACKUP_DIR"
                  DATE=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="$BACKUP_DIR/markstudio-$DATE.sql.gz"

                  echo "[backup] Starting Odoo PostgreSQL backup..."
                  pg_dump -h odoo-db-svc -U odoo -d markstudio | gzip > "$BACKUP_FILE"

                  if [ $? -eq 0 ]; then
                    SIZE=$(du -h "$BACKUP_FILE" | cut -f1)
                    echo "[backup] Success: $BACKUP_FILE ($SIZE)"
                  else
                    echo "[backup] FAILED"
                    exit 1
                  fi

                  # Keep only last 7 backups
                  ls -t "$BACKUP_DIR"/markstudio-*.sql.gz 2>/dev/null | tail -n +8 | xargs rm -f 2>/dev/null
                  REMAINING=$(ls "$BACKUP_DIR"/markstudio-*.sql.gz 2>/dev/null | wc -l)
                  echo "[backup] Retained $REMAINING backups"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: odoo-filestore-pvc
