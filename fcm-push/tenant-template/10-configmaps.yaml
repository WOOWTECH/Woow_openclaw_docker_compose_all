# ConfigMaps for the tenant Odoo pod: Odoo server config + nginx reverse proxy.
#
# PLACEHOLDERS:
#   __TENANT__        = tenant slug / resource prefix.
#   __DBNAME__        = postgres database AND role name (alphanumeric, NO dashes).
#   __DBPASS__        = postgres password. NOTE: this value is rendered into the
#                       config at deploy time. The template on disk only ever
#                       holds the placeholder — never commit a rendered copy.
#   __ADMIN_PASSWD__  = Odoo master (DB-management) password.
#
# The db_password here MUST equal the POSTGRES_PASSWORD in the
# __TENANT__-postgres-secret (see the secret-create command in DEPLOY-RUNBOOK.md).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: __TENANT__-odoo-config
  namespace: __TENANT__
  labels:
    app.kubernetes.io/part-of: __TENANT__
data:
  odoo.conf: |
    [options]
    db_host = __TENANT__-postgres-svc
    db_port = 5432
    db_user = __DBNAME__
    db_password = __DBPASS__
    db_name = __DBNAME__
    db_maxconn = 64
    db_template = template1
    db_filter = ^__DBNAME__$
    admin_passwd = __ADMIN_PASSWD__
    addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
    data_dir = /var/lib/odoo
    http_port = 8069
    longpolling_port = 8072
    proxy_mode = True
    server_wide_modules = base,web
    workers = 2
    max_cron_threads = 1
    limit_memory_hard = 2684354560
    limit_memory_soft = 2147483648
    limit_time_cpu = 600
    limit_time_real = 1200
    limit_request = 8192
    log_level = info
    logfile = False
    without_demo = False
    list_db = True
    load_language = en_US
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: __TENANT__-nginx-config
  namespace: __TENANT__
  labels:
    app.kubernetes.io/part-of: __TENANT__
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 65;
        client_max_body_size 100m;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 256;
        gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;
        proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=odoo_assets:10m max_size=200m inactive=7d;
        upstream odoo_backend { server 127.0.0.1:8069; }
        upstream odoo_longpolling { server 127.0.0.1:8072; }
        server {
            listen 8080;
            server_name _;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            location /web/assets/ {
                proxy_pass http://odoo_backend;
                proxy_cache odoo_assets;
                proxy_cache_valid 200 7d;
                add_header X-Cache-Status $upstream_cache_status;
                expires 7d;
            }
            location /web/static/ {
                proxy_pass http://odoo_backend;
                proxy_cache odoo_assets;
                proxy_cache_valid 200 7d;
                expires 7d;
            }
            location /websocket {
                proxy_pass http://odoo_longpolling;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 86400;
            }
            location / {
                proxy_pass http://odoo_backend;
                proxy_read_timeout 720s;
                proxy_connect_timeout 720s;
                proxy_send_timeout 720s;
            }
        }
    }
