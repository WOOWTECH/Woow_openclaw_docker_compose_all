# =============================================================
# Hermes WebUI - Web Interface
# Image: ghcr.io/nesquena/hermes-webui:latest
# Port:  8787
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-webui
  namespace: hermes
  labels:
    app: hermes-webui
    app.kubernetes.io/component: webui
    app.kubernetes.io/part-of: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-webui
  template:
    metadata:
      labels:
        app: hermes-webui
    spec:
      containers:
        - name: hermes-webui
          image: ghcr.io/nesquena/hermes-webui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8787
              name: http
          env:
            - name: HERMES_WEBUI_HOST
              value: "0.0.0.0"
            - name: HERMES_WEBUI_PORT
              value: "8787"
            - name: HERMES_WEBUI_STATE_DIR
              value: "/home/hermeswebui/.hermes/webui"
            - name: HERMES_HOME
              value: "/home/hermeswebui/.hermes"
            - name: WANTED_UID
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: WANTED_UID
            - name: WANTED_GID
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: WANTED_UID
            # Connect to hermes-agent gateway
            - name: GATEWAY_HEALTH_URL
              value: "http://hermes-agent-svc:8642"
            # Security
            - name: HERMES_WEBUI_PASSWORD
              value: "woowtech"
          tty: true
          volumeMounts:
            - name: hermes-home
              mountPath: /home/hermeswebui/.hermes
          readinessProbe:
            tcpSocket:
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8787
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 1000m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 2Gi
      volumes:
        - name: hermes-home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-webui-svc
  namespace: hermes
  labels:
    app: hermes-webui
    app.kubernetes.io/part-of: hermes
spec:
  selector:
    app: hermes-webui
  ports:
    - protocol: TCP
      port: 8787
      targetPort: 8787
      name: http
  type: ClusterIP
