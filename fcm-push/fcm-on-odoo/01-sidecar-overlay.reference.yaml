# fcm-sidecar overlay REFERENCE for the Odoo pod (05-odoo.yaml).
#
# This file is a COMMENTED REFERENCE — not directly appliable via kubectl.
# Copy the relevant blocks into your tenant's 05-odoo.yaml, replacing the
# $TEMPLATE variables. Proven end-to-end on k3s v1.34 (fcm-e2e namespace,
# real iPhone push received).
#
# TEMPLATE variables:
#   $NAMESPACE — the tenant's k8s namespace (e.g. bnidistrict-odoo)
#   $TENANT    — the tenant_id registered in namespace_tenant_map
#   $DB_NAME / $DB_HOST / $DB_USER / $DB_PASS — tenant's Odoo DB
#   $FIREBASE_PROJECT_ID — e.g. woow-odoo-de2cb
#
# Prerequisites:
#   1. ServiceAccount fcm-sidecar created in $NAMESPACE (00-sa.yaml)
#   2. imagePullSecret ghcr-pull created in $NAMESPACE
#   3. github-token secret created in $NAMESPACE (for private repo clone;
#      see 02-github-token-secret.yaml)
#   4. namespace_tenant_map row: ($NAMESPACE, $TENANT) in central postgres
#   5. Pod spec must set: serviceAccountName: fcm-sidecar
#   6. Pod-level securityContext must add: supplementalGroups: [10002]
#      (so Odoo uid=100 can read the fcm socket at mode 0660, group 10002)
#   7. Odoo container's volumeMounts must add: fcm-run readOnly
#
# SH-1: capabilities.add:[IPC_LOCK] is NOT required — mlockall was removed.
# Anti-swap relies on node-layer (k8s NoSwap default + VmSwap==0 verification).
#
# UID CONVENTION (verified on fcm-e2e, 2026-07-05):
#   Odoo 18 image runs as uid=100, gid=101 (user "odoo").
#   fsGroup=101 sets group ownership on all volumes.
#   /var/lib/odoo/sessions has mode 0700 — so the OWNER must be uid=100.
#   The install-plugin-deps init container runs as root (runAsUser: 0) to
#   pip install system-wide, then chown -R 100:101 /var/lib/odoo to restore
#   ownership. This is the same pattern as the fix-permissions init container.

# =====================================================================
