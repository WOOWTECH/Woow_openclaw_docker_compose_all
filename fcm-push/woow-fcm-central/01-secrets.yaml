# Secrets for the woow-fcm-central control plane.
#
# PLACEHOLDER VALUES ONLY — do NOT commit real credentials to git.
#
# At deploy time, replace each secret with real values:
#
#   # DB password:
#   kubectl -n woow-fcm-central create secret generic db-credentials \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # Admin session secret:
#   kubectl -n woow-fcm-central create secret generic admin-session \
#     --from-literal=ADMIN_SESSION_SECRET="$(openssl rand -base64 48)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # Google master Service Account (for TVS token vending):
#   kubectl -n woow-fcm-central create secret generic fcm-master-sa \
#     --from-file=fcm_master_sa.json=/secure/path/to/real_sa.json \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # GHCR pull secret (PRODUCTION: use a read:packages-only PAT, NEVER the CLI token):
#   kubectl -n woow-fcm-central create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=WOOWTECH \
#     --docker-password="$(cat /secure/path/to/ghcr-read-pat)" \
#     --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: woow-fcm-central
  labels:
    app.kubernetes.io/part-of: woow-fcm-central
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE-AT-DEPLOY-TIME"
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-session
  namespace: woow-fcm-central
  labels:
    app.kubernetes.io/part-of: woow-fcm-central
type: Opaque
stringData:
  ADMIN_SESSION_SECRET: "REPLACE-AT-DEPLOY-TIME"
---
apiVersion: v1
kind: Secret
metadata:
  name: fcm-master-sa
  namespace: woow-fcm-central
  labels:
    app.kubernetes.io/part-of: woow-fcm-central
    app.kubernetes.io/component: master-sa
type: Opaque
stringData:
  fcm_master_sa.json: |
    {
      "type": "service_account",
      "project_id": "REPLACE-AT-DEPLOY-TIME",
      "private_key_id": "REPLACE-AT-DEPLOY-TIME",
      "private_key": "-----BEGIN PRIVATE KEY-----\nREPLACE-AT-DEPLOY-TIME\n-----END PRIVATE KEY-----\n",
      "client_email": "REPLACE-AT-DEPLOY-TIME@REPLACE.iam.gserviceaccount.com",
      "client_id": "REPLACE-AT-DEPLOY-TIME",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token"
    }
