apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-tunnel-token
  namespace: inzense
  labels:
    app.kubernetes.io/name: inzense-odoo
    app.kubernetes.io/component: tunnel
stringData:
  TUNNEL_TOKEN: "eyJhIjoiOWMyN2Y2MjNlZTU5NmUwYjY3YmU1NjI2M2JjYjE5NzQiLCJ0IjoiYTU5Y2EwOTQtMmY2Mi00ZmQ0LTg2ZjAtNDUyZWYzMDk4MGU2IiwicyI6IkZNUVF6YlVaaTN2Ymt4M0lhaEx1NkJaTWNqbGVGTi9xeW9WWGxuTXprcGs9In0="
type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: inzense
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: inzense-odoo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/part-of: inzense-odoo
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: Always
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: TUNNEL_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
