# =============================================================
# Odoo 18 Configuration — odoo.conf as ConfigMap
# =============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
  namespace: markstudio-odoo
  labels:
    app.kubernetes.io/part-of: markstudio-odoo
data:
  odoo.conf: |
    [options]
    ; --- Database ---
    ; db_host, db_port, db_user, db_password are set via env vars
    ; (HOST, PORT, USER, PASSWORD) and injected by the Docker entrypoint.
    ; Do NOT set them here — the entrypoint overrides env vars with conf values.
    db_name = markstudio
    db_maxconn = 64

    ; --- Paths ---
    addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
    data_dir = /var/lib/odoo

    ; --- HTTP ---
    xmlrpc_port = 8069
    gevent_port = 8072
    longpolling_port = 8072
    proxy_mode = True
    server_wide_modules = base,web

    ; --- Workers ---
    workers = 2
    max_cron_threads = 1

    ; --- Limits ---
    limit_memory_hard = 2684354560
    limit_memory_soft = 2147483648
    limit_time_cpu = 600
    limit_time_real = 1200

    ; --- Security ---
    list_db = False
    ; admin_passwd set via env var to avoid entrypoint override

    ; --- Logging ---
    log_level = info
    log_handler = :INFO
