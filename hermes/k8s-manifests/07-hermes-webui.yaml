# =============================================================
# Hermes WebUI - Web Interface
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-webui
  namespace: hermes
  labels:
    app: hermes-webui
    app.kubernetes.io/component: webui
    app.kubernetes.io/part-of: hermes
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hermes-webui
  template:
    metadata:
      labels:
        app: hermes-webui
    spec:
      containers:
        - name: hermes-webui
          image: ghcr.io/nesquena/hermes-webui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            # WebUI port
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: HERMES_WEBUI_PORT
            - name: HERMES_WEBUI_PORT
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: HERMES_WEBUI_PORT
            # Agent backend URL
            - name: HERMES_AGENT_URL
              value: "http://hermes-agent-svc:8080"
            # Database (direct access for WebUI if needed)
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: POSTGRES_PASSWORD
            # Redis
            - name: REDIS_URL
              value: "redis://hermes-redis-svc:6379/0"
            # App
            - name: HERMES_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: HERMES_BASE_URL
            - name: WANTED_UID
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: WANTED_UID
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-webui-svc
  namespace: hermes
  labels:
    app: hermes-webui
    app.kubernetes.io/part-of: hermes
spec:
  selector:
    app: hermes-webui
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
