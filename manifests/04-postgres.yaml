apiVersion: apps/v1
kind: Deployment
metadata:
  name: inzense-postgres
  namespace: inzense
  labels:
    app.kubernetes.io/name: inzense-odoo
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inzense-odoo
      app.kubernetes.io/component: database
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inzense-odoo
        app.kubernetes.io/component: database
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: inzense-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inzense-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: inzense-db-secret
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - inzense
                - -d
                - inzense
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - inzense
                - -d
                - inzense
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: inzense-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: inzense-postgres
  namespace: inzense
  labels:
    app.kubernetes.io/name: inzense-odoo
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: inzense-odoo
    app.kubernetes.io/component: database
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP
