# whitelist-service Deployment + Service — from central/deploy/k8s/whitelist-service-deployment.yaml
# Added: nodeSelector, app.kubernetes.io labels, serviceAccountName for TokenReview RBAC.
---
apiVersion: v1
kind: Service
metadata:
  name: whitelist-service
  namespace: woow-fcm-central
  labels:
    app: whitelist-service
    app.kubernetes.io/part-of: woow-fcm-central
spec:
  type: ClusterIP
  selector:
    app: whitelist-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whitelist-service
  namespace: woow-fcm-central
  labels:
    app: whitelist-service
    app.kubernetes.io/part-of: woow-fcm-central
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: whitelist-service
  template:
    metadata:
      labels:
        app: whitelist-service
        app.kubernetes.io/part-of: woow-fcm-central
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      serviceAccountName: whitelist-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whitelist-service
          # PRODUCTION: use a dedicated read:packages-only PAT for ghcr-pull,
          # never the gh CLI token (which has write:packages scope).
          image: ghcr.io/woowtech/whitelist-service:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: central-env
            - secretRef:
                name: admin-session
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: PORT
              value: "8000"
          volumeMounts:
            - name: whitelist-data
              mountPath: /var/lib/whitelist
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        - name: whitelist-data
          emptyDir: {}
