apiVersion: apps/v1
kind: Deployment
metadata:
  name: inzense-odoo
  namespace: inzense
  labels:
    app.kubernetes.io/name: inzense-odoo
    app.kubernetes.io/component: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inzense-odoo
      app.kubernetes.io/component: application
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inzense-odoo
        app.kubernetes.io/component: application
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z inzense-postgres 5432; do
                echo "PostgreSQL is not ready - sleeping"
                sleep 2
              done
              echo "PostgreSQL is ready!"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: odoo
          image: odoo:18.0
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: inzense-postgres
            - name: PORT
              value: "5432"
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: inzense-db-secret
                  key: POSTGRES_USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inzense-db-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 8069
              name: http
            - containerPort: 8072
              name: longpolling
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: odoo-config
              mountPath: /etc/odoo
              readOnly: true
            - name: odoo-filestore
              mountPath: /var/lib/odoo
            - name: odoo-addons
              mountPath: /mnt/extra-addons
      volumes:
        - name: odoo-config
          configMap:
            name: odoo-config
        - name: odoo-filestore
          persistentVolumeClaim:
            claimName: inzense-odoo-filestore-pvc
        - name: odoo-addons
          persistentVolumeClaim:
            claimName: inzense-odoo-addons-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: inzense-odoo
  namespace: inzense
  labels:
    app.kubernetes.io/name: inzense-odoo
    app.kubernetes.io/component: application
spec:
  selector:
    app.kubernetes.io/name: inzense-odoo
    app.kubernetes.io/component: application
  ports:
    - port: 8069
      targetPort: 8069
      name: http
    - port: 8072
      targetPort: 8072
      name: longpolling
  type: ClusterIP
