# =============================================================
# Hermes WebUI - Web Interface
# Image: ghcr.io/nesquena/hermes-webui:latest
# Port:  8787
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-webui
  namespace: hermes
  labels:
    app: hermes-webui
    app.kubernetes.io/component: webui
    app.kubernetes.io/part-of: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-webui
  template:
    metadata:
      labels:
        app: hermes-webui
    spec:
      initContainers:
        # 1) Clone hermes-agent source from GitHub (lightweight)
        - name: clone-agent-src
          image: alpine/git:latest
          command: ['sh', '-c']
          args:
            - |
              git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /agent-src
              chown -R 1000:1000 /agent-src
          volumeMounts:
            - name: agent-src
              mountPath: /agent-src
        # 2) Write .env and config.yaml into hermes-home
        - name: init-config
          image: busybox
          command: ['sh', '-c']
          args:
            - |
              printf 'MINIMAX_API_KEY=%s\n' "$MINIMAX_API_KEY" > /data/.env
              printf 'model:\n  default: "minimax/MiniMax-M2.7"\n  provider: "minimax"\n' > /data/config.yaml
              chown -R 1000:1000 /data
          env:
            - name: MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: MINIMAX_API_KEY
          volumeMounts:
            - name: hermes-home
              mountPath: /data
      containers:
        - name: hermes-webui
          image: ghcr.io/nesquena/hermes-webui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8787
              name: http
          env:
            - name: HERMES_WEBUI_HOST
              value: "0.0.0.0"
            - name: HERMES_WEBUI_PORT
              value: "8787"
            - name: HERMES_WEBUI_STATE_DIR
              value: "/home/hermeswebui/.hermes/webui"
            - name: HERMES_HOME
              value: "/home/hermeswebui/.hermes"
            - name: WANTED_UID
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: WANTED_UID
            - name: WANTED_GID
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: WANTED_UID
            # Connect to hermes-agent gateway
            - name: GATEWAY_HEALTH_URL
              value: "http://hermes-agent-svc:8642"
            # LLM - Minimax
            - name: MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: MINIMAX_API_KEY
            # Security
            - name: HERMES_WEBUI_PASSWORD
              value: "woowtech"
          tty: true
          volumeMounts:
            - name: hermes-home
              mountPath: /home/hermeswebui/.hermes
            - name: agent-src
              mountPath: /home/hermeswebui/.hermes/hermes-agent
          readinessProbe:
            tcpSocket:
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8787
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 1000m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 2Gi
      volumes:
        - name: hermes-home
          emptyDir: {}
        - name: agent-src
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-webui-svc
  namespace: hermes
  labels:
    app: hermes-webui
    app.kubernetes.io/part-of: hermes
spec:
  selector:
    app: hermes-webui
  ports:
    - protocol: TCP
      port: 8787
      targetPort: 8787
      name: http
  type: ClusterIP
