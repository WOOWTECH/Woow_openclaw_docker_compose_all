# NetworkPolicy: Allow ingress from cloudflare tunnel and internal traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-design-policy
  namespace: open-design
spec:
  podSelector:
    matchLabels:
      app: open-design
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from any namespace (cloudflare tunnel, internal services)
    - from:
        - namespaceSelector: {}
      ports:
        - port: 7457
    # Allow traffic from within the namespace
    - from:
        - podSelector: {}
      ports:
        - port: 7457
