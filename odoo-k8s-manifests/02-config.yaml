# =============================================================
# Odoo 18 Configuration — odoo.conf as ConfigMap
# =============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
  namespace: markstudio-odoo
  labels:
    app.kubernetes.io/part-of: markstudio-odoo
data:
  odoo.conf: |
    [options]
    ; --- Database ---
    db_host = odoo-db-svc
    db_port = 5432
    db_user = odoo
    db_password = False
    db_name = markstudio
    db_maxconn = 64

    ; --- Paths ---
    addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
    data_dir = /var/lib/odoo

    ; --- HTTP ---
    xmlrpc_port = 8069
    gevent_port = 8072
    longpolling_port = 8072
    proxy_mode = True
    server_wide_modules = base,web

    ; --- Workers ---
    workers = 2
    max_cron_threads = 1

    ; --- Limits ---
    limit_memory_hard = 2684354560
    limit_memory_soft = 2147483648
    limit_time_cpu = 600
    limit_time_real = 1200

    ; --- Security ---
    list_db = False
    admin_passwd = False

    ; --- Logging ---
    log_level = info
    log_handler = :INFO
