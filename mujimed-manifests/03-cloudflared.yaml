# =============================================================
# Cloudflare Tunnel - mujimed-odoo.woowtech.io
# Routes external HTTPS traffic to Odoo service
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mujimed-cloudflared
  namespace: mujimed-odoo
  labels:
    app: mujimed-cloudflared
    app.kubernetes.io/component: tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mujimed-cloudflared
  template:
    metadata:
      labels:
        app: mujimed-cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mujimed-secrets
                  key: CF_TUNNEL_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
